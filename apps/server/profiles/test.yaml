# MSCD deployment profile: automated tests (build plan I.1). Development flavour only; never in a release image.
# As demo.yaml, plus: no cron schedules (tests enqueue jobs directly), warn-level logs, no trusted proxy, and
# local addresses: the developer stack (deploy/compose/dev) for PostgreSQL, SeaweedFS and Mailpit, and the fixed
# API E2E ports of R-05 for the web (4174), mock providers (4310) and storage gateway (4311). Test suites and
# the API E2E stack override what they start on random ports (MSCD__... variables or MSCD_DATABASE_URL).
tenancy:   { mode: single, isolation: database }
license:   { validation: offline }
updates:   { channel: offline }
packs:     { channel: offline, dir: ../../../packs/dist, channel_url: null }
telemetry: { enabled: false, otlp_endpoint: null }
kms:       { provider: file, file: { path: ../test/fixtures/secrets/platform.key, previous_paths: [] } }
identity:
  providers: [local, oidc, saml]
  local: { mfa_required: true }
  oidc: { allow_insecure_http: true }
  session: { idle_minutes: 60, absolute_hours: 8, remember_hours: 12, guest_idle_minutes: 30, guest_absolute_hours: 4 }
mail:      { transport: smtp, from: "MSCD Test <mscd@test.invalid>", smtp: { host: localhost, port: 51025, secure: false, user: null, password_file: null } }
storage:
  adapters: { enabled: [managed_vault, m365, google_drive] }
  max_upload_bytes: 104857600
  gateway: { url: "http://localhost:4311", token_file: ../test/fixtures/secrets/gateway.token,
             tls: { mode: "off", ca_file: null, cert_file: null, key_file: null } }
network:   { egress_allowlist: [] }
jobs:      { driver: pgboss, schedules_enabled: false, bullmq: { url: null } }
http:      { port: 3000, public_url: "http://localhost:4174", trust_proxy: { hops: 0 } }
security:  { cookie_secure: false }
database:  { url_file: ../test/fixtures/secrets/db-app.url, migrator_url_file: ../test/fixtures/secrets/db-migrator.url,
             pack_installer_url_file: ../test/fixtures/secrets/db-pack.url, admin_url_file: ../test/fixtures/secrets/db-admin.url,
             pool_max: 10 }
audit:     { anchor_key_file: ../test/fixtures/secrets/audit-anchor.key }
observability: { log_level: warn, metrics_port: 9464 }
demo:      { enabled: true, acknowledge_insecure: true, fixed_today: "2026-09-29", personas: true, keycloak: null }
test:      { endpoints_enabled: false, template_database: null, admin_database_url_file: null }
gateway:
  port: 4311
  token_files: [../test/fixtures/secrets/gateway.token]
  kms: { provider: file, file: { path: ../test/fixtures/secrets/storage.key, previous_paths: [] } }
  tls: { mode: "off", ca_file: null, cert_file: null, key_file: null }
  vault: { endpoint: "http://localhost:58333", region: us-east-1, bucket: mscd-vault, force_path_style: true,
           access_key_file: ../test/fixtures/secrets/s3.access, secret_key_file: ../test/fixtures/secrets/s3.secret }
  providers:
    m365: { graph_base_url: "http://localhost:4310/v1.0", login_base_url: "http://localhost:4310" }
    google: { api_base_url: "http://localhost:4310", token_url: "http://localhost:4310/token" }
