# MSCD deployment profile: demo (build plan I.1). Development flavour only; never in a release image.
# Hosts are the service names of the Compose demo overlay (mock-providers, mailpit, keycloak, storage-gateway).
# Secret files point to the committed development values in apps/server/test/fixtures/secrets (R-11), whose
# database URLs reach the developer stack (deploy/compose/dev) on localhost:55432; the Compose overlay overrides
# them with its own secrets. Relative paths resolve against the folder of this file.
tenancy:   { mode: single, isolation: database }
license:   { validation: offline }
updates:   { channel: offline }
packs:     { channel: offline, dir: ../../../packs/dist, channel_url: null }
telemetry: { enabled: false, otlp_endpoint: null }
kms:       { provider: file, file: { path: ../test/fixtures/secrets/platform.key, previous_paths: [] } }
identity:
  providers: [local, oidc, saml]
  local: { mfa_required: true }
  oidc: { allow_insecure_http: true }
  session: { idle_minutes: 60, absolute_hours: 8, remember_hours: 12, guest_idle_minutes: 30, guest_absolute_hours: 4 }
mail:      { transport: smtp, from: "MSCD Demo <mscd@demo.invalid>", smtp: { host: mailpit, port: 1025, secure: false, user: null, password_file: null } }
storage:
  adapters: { enabled: [managed_vault, m365, google_drive] }
  max_upload_bytes: 104857600
  gateway: { url: "http://storage-gateway:8443", token_file: ../test/fixtures/secrets/gateway.token,
             tls: { mode: "off", ca_file: null, cert_file: null, key_file: null } }
network:   { egress_allowlist: [] }
jobs:      { driver: pgboss, schedules_enabled: true, bullmq: { url: null } }
http:      { port: 3000, public_url: "http://localhost:18080", trust_proxy: { cidrs: ["172.31.250.10/32"] } }
security:  { cookie_secure: false }
database:  { url_file: ../test/fixtures/secrets/db-app.url, migrator_url_file: ../test/fixtures/secrets/db-migrator.url,
             pack_installer_url_file: ../test/fixtures/secrets/db-pack.url, admin_url_file: ../test/fixtures/secrets/db-admin.url,
             pool_max: 10 }
audit:     { anchor_key_file: ../test/fixtures/secrets/audit-anchor.key }
observability: { log_level: info, metrics_port: 9464 }
demo:
  enabled: true
  acknowledge_insecure: true
  fixed_today: "2026-09-29"
  personas: true
  keycloak: { issuer: "http://keycloak:18088/realms/mscd", client_id: mscd, client_secret_file: /run/secrets/keycloak-client.secret }
gateway:
  port: 8443
  token_files: [../test/fixtures/secrets/gateway.token]
  kms: { provider: file, file: { path: ../test/fixtures/secrets/storage.key, previous_paths: [] } }
  tls: { mode: "off", ca_file: null, cert_file: null, key_file: null }
  vault: { endpoint: "http://objectstore:8333", region: us-east-1, bucket: mscd-vault, force_path_style: true,
           access_key_file: ../test/fixtures/secrets/s3.access, secret_key_file: ../test/fixtures/secrets/s3.secret }
  providers:
    m365: { graph_base_url: "http://mock-providers:4310/v1.0", login_base_url: "http://mock-providers:4310" }
    google: { api_base_url: "http://mock-providers:4310", token_url: "http://mock-providers:4310/token" }
