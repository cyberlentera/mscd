# Test server overlay for the demo stack (use after docker-compose.yml and
# docker-compose.demo.yml). Publishes only the web service on every address of
# the server, on MSCD_PUBLIC_PORT (80). Keycloak and Mailpit stay on 127.0.0.1.
# Demo data and public demo keys: for trying the platform, never for real data.
services:
  web:
    ports: !override
      - "0.0.0.0:${MSCD_PUBLIC_PORT:-80}:8080"
