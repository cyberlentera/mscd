{{- /* Routes / and /api to the web Service; NGINX in the web pods proxies /api to the api (F.12). */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mscd.fullname" . }}
  labels:
    {{- include "mscd.labels" (list . "web") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- range list "/api" "/" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "mscd.webHost" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
