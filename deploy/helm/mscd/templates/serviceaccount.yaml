{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mscd.serviceAccountName" . }}
  labels:
    {{- include "mscd.labels" (list . "serviceaccount") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# MSCD never calls the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
