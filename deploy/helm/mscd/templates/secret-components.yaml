{{- /*
One Secret per component (I.4), rendered only with secrets.create (tests).
Every value comes from secrets.values, else from the Secret of a previous
release (lookup), else is generated. All Secrets are made in this one file so
that a generated value (gateway token, database passwords) is the same in every
Secret that holds it.
The migrate Secret, and with testServices the PostgreSQL Secret, are hooks:
the migrate Job runs before the release's own resources exist.
*/}}
{{- if .Values.secrets.create }}
{{- $ns := .Release.Namespace }}
{{- $fullname := include "mscd.fullname" . }}
{{- $v := .Values.secrets.values }}
{{- $apiName := include "mscd.secretName" (list . "api") }}
{{- $workerName := include "mscd.secretName" (list . "worker") }}
{{- $gatewayName := include "mscd.secretName" (list . "gateway") }}
{{- $migrateName := include "mscd.secretName" (list . "migrate") }}
{{- $pgName := printf "%s-postgres" $fullname }}
{{- $objName := printf "%s-objectstore" $fullname }}
{{- $old := dict }}
{{- range $key, $name := dict "api" $apiName "worker" $workerName "gateway" $gatewayName "migrate" $migrateName "postgres" $pgName }}
{{- $found := lookup "v1" "Secret" $ns $name }}
{{- $_ := set $old $key (($found).data | default dict) }}
{{- end }}
{{- $platformKey := include "mscd.pickSecret" (list $v.platformKey (index $old.api "platform.key" | default (index $old.worker "platform.key")) (randBytes 32)) }}
{{- $gatewayToken := include "mscd.pickSecret" (list $v.gatewayToken (index $old.api "gateway.token" | default (index $old.gateway "gateway.token")) (randAlphaNum 48)) }}
{{- $storageKey := include "mscd.pickSecret" (list $v.storageKey (index $old.gateway "storage.key") (randBytes 32)) }}
{{- $anchorKey := include "mscd.pickSecret" (list $v.auditAnchorKey (index $old.worker "audit-anchor.key") (genPrivateKey "ed25519")) }}
{{- $s3Access := include "mscd.pickSecret" (list $v.s3AccessKey (index $old.gateway "s3.access") (ternary (printf "mscd-%s" (randAlphaNum 12 | lower)) "" .Values.testServices.enabled)) }}
{{- $s3Secret := include "mscd.pickSecret" (list $v.s3SecretKey (index $old.gateway "s3.secret") (ternary (randAlphaNum 40) "" .Values.testServices.enabled)) }}
{{- if not (and $s3Access $s3Secret) }}
{{- fail "secrets.create: set secrets.values.s3AccessKey and secrets.values.s3SecretKey (the object store credentials), or enable testServices" }}
{{- end }}
{{- $dbApp := $v.dbAppUrl }}
{{- $dbMigrator := $v.dbMigratorUrl }}
{{- $dbPack := $v.dbPackUrl }}
{{- $pg := dict }}
{{- if .Values.testServices.enabled }}
{{- range $key := list "admin-password" "migrator-password" "app-password" "pack-password" }}
{{- $_ := set $pg $key (include "mscd.pickSecret" (list "" (index $old.postgres $key) (randAlphaNum 32))) }}
{{- end }}
{{- $host := printf "%s:5432" (include "mscd.postgresHost" .) }}
{{- $dbApp = $dbApp | default (printf "postgres://mscd_app:%s@%s/mscd" (index $pg "app-password") $host) }}
{{- $dbMigrator = $dbMigrator | default (printf "postgres://mscd_migrator:%s@%s/mscd" (index $pg "migrator-password") $host) }}
{{- $dbPack = $dbPack | default (printf "postgres://mscd_pack_installer:%s@%s/mscd" (index $pg "pack-password") $host) }}
{{- end }}
{{- if not (and $dbApp $dbMigrator $dbPack) }}
{{- fail "secrets.create: set secrets.values.dbAppUrl, dbMigratorUrl and dbPackUrl, or enable testServices" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $apiName }}
  labels:
    {{- include "mscd.labels" (list . "api") | nindent 4 }}
type: Opaque
data:
  db-app.url: {{ $dbApp | b64enc }}
  platform.key: {{ $platformKey | b64enc }}
  gateway.token: {{ $gatewayToken | b64enc }}
  {{- if .Values.secrets.smtpPassword }}
  smtp.password: {{ $v.smtpPassword | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $workerName }}
  labels:
    {{- include "mscd.labels" (list . "worker") | nindent 4 }}
type: Opaque
data:
  db-app.url: {{ $dbApp | b64enc }}
  platform.key: {{ $platformKey | b64enc }}
  gateway.token: {{ $gatewayToken | b64enc }}
  db-pack.url: {{ $dbPack | b64enc }}
  audit-anchor.key: {{ $anchorKey | b64enc }}
  {{- if .Values.secrets.smtpPassword }}
  smtp.password: {{ $v.smtpPassword | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gatewayName }}
  labels:
    {{- include "mscd.labels" (list . "gateway") | nindent 4 }}
type: Opaque
data:
  storage.key: {{ $storageKey | b64enc }}
  s3.access: {{ $s3Access | b64enc }}
  s3.secret: {{ $s3Secret | b64enc }}
  gateway.token: {{ $gatewayToken | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $migrateName }}
  labels:
    {{- include "mscd.labels" (list . "migrate") | nindent 4 }}
  annotations:
    # Created before the migrate Job; kept between upgrades so lookup finds it.
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
data:
  db-migrator.url: {{ $dbMigrator | b64enc }}
  db-pack.url: {{ $dbPack | b64enc }}
{{- if .Values.testServices.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "mscd.labels" (list . "postgres") | nindent 4 }}
  annotations:
    # The test database must run before the migrate hook (testservices.yaml).
    helm.sh/hook: pre-install
    helm.sh/hook-weight: "-10"
type: Opaque
data:
  {{- range $key, $value := $pg }}
  {{ $key }}: {{ $value | b64enc }}
  {{- end }}
  postgres-roles.env: {{ printf "MSCD_MIGRATOR_PASSWORD=%s\nMSCD_APP_PASSWORD=%s\nMSCD_PACK_INSTALLER_PASSWORD=%s\n" (index $pg "migrator-password") (index $pg "app-password") (index $pg "pack-password") | b64enc }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $objName }}
  labels:
    {{- include "mscd.labels" (list . "objectstore") | nindent 4 }}
type: Opaque
data:
  s3.json: {{ dict "identities" (list (dict "name" "mscd" "credentials" (list (dict "accessKey" $s3Access "secretKey" $s3Secret)) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | b64enc }}
{{- end }}
{{- end }}
