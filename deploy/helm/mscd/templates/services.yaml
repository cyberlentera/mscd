{{- /* web is the only Service meant for the Ingress; api and storage-gateway are cluster-internal. */}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mscd.webHost" . }}
  labels:
    {{- include "mscd.labels" (list . "web") | nindent 4 }}
  {{- with .Values.web.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    {{- include "mscd.selectorLabels" (list . "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePorts.http }}
      nodePort: {{ .Values.web.service.nodePorts.http }}
      {{- end }}
    {{- if .Values.web.tls.enabled }}
    - name: https
      port: {{ .Values.web.service.httpsPort }}
      targetPort: https
      protocol: TCP
      {{- if and (eq .Values.web.service.type "NodePort") .Values.web.service.nodePorts.https }}
      nodePort: {{ .Values.web.service.nodePorts.https }}
      {{- end }}
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mscd.apiHost" . }}
  labels:
    {{- include "mscd.labels" (list . "api") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mscd.selectorLabels" (list . "api") | nindent 4 }}
  ports:
    - name: http
      port: {{ include "mscd.apiPort" . }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mscd.gatewayHost" . }}
  labels:
    {{- include "mscd.labels" (list . "gateway") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "mscd.selectorLabels" (list . "gateway") | nindent 4 }}
  ports:
    - name: gateway
      port: {{ include "mscd.gatewayPort" . }}
      targetPort: gateway
      protocol: TCP
