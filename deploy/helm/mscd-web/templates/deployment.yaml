{{- if and .Values.tls.enabled (not .Values.tls.secretName) }}
{{- fail "tls.enabled is true: set tls.secretName to a kubernetes.io/tls secret" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mscd-web.fullname" . }}
  labels:
    {{- include "mscd-web.labels" . | nindent 4 }}
spec:
  {{- if .Values.autoscaling.enabled }}
  {{- /* Keep the count the autoscaler chose, and never start below minReplicas. */}}
  {{- $replicas := int .Values.autoscaling.minReplicas }}
  {{- $current := lookup "apps/v1" "Deployment" .Release.Namespace (include "mscd-web.fullname" .) }}
  {{- if $current }}
  {{- $replicas = max $replicas (int $current.spec.replicas) }}
  {{- end }}
  replicas: {{ $replicas }}
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "mscd-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mscd-web.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "mscd-web.serviceAccountName" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "mscd-web.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: MSCD_HTTP_REDIRECT
              value: {{ .Values.config.httpRedirect | quote }}
            - name: MSCD_HTTPS_PUBLIC_PORT
              value: {{ .Values.service.httpsPort | quote }}
            - name: MSCD_DOMAIN
              value: {{ include "mscd-web.domain" . | quote }}
            - name: MSCD_HSTS
              value: {{ .Values.config.hsts | quote }}
            - name: MSCD_EXTERNAL_FONTS
              value: {{ .Values.config.externalFonts | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.tls.enabled }}
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          {{- if .Values.preStopSleepSeconds }}
          # Keep serving while the ingress controller drops this pod from rotation.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "{{ .Values.preStopSleepSeconds }}"]
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.secretName }}
            defaultMode: 0440
        {{- end }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.topologyKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mscd-web.selectorLabels" . | nindent 14 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
