{{- if and .Values.podDisruptionBudget.enabled (include "mscd-web.multiPod" .) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "mscd-web.fullname" . }}
  labels:
    {{- include "mscd-web.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "mscd-web.selectorLabels" . | nindent 6 }}
{{- end }}
