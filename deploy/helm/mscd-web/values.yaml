# Default values for the MSCD web chart.
# The defaults suit a restricted namespace (Pod Security Standard "restricted").
# values-ha.yaml next to this file is a reference for production.

# -- Number of pods when autoscaling is off.
replicaCount: 2

image:
  # -- Image repository. For air-gapped clusters, push the bundle image to your
  # internal registry and set this, for example registry.example.internal/cyberlentera/mscd-web
  repository: cyberlentera/mscd-web
  # -- Image tag. Empty means the chart appVersion.
  tag: ""
  # -- When the kubelet pulls the image: IfNotPresent, Always or Never.
  pullPolicy: IfNotPresent

# -- Secrets for pulling from a private registry, for example [{name: regcred}]
imagePullSecrets: []

# -- Replaces the chart name in resource names.
nameOverride: ""
# -- Replaces the full resource name (release name plus chart name).
fullnameOverride: ""

serviceAccount:
  # -- Create a dedicated service account (it gets no API token).
  create: true
  # -- Name to use. Empty means the release full name.
  name: ""
  # -- Annotations for the service account.
  annotations: {}

# Application settings passed to the container.
config:
  # -- Host name users open. Used for the HTTP to HTTPS redirect inside the pod.
  # Empty means the first ingress host, or the Host header of the request when
  # the Ingress is off.
  domain: ""
  # -- Redirect HTTP to HTTPS inside the pod. Only applies when tls.enabled is true.
  # Leave false when the Ingress handles TLS and redirects.
  httpRedirect: false
  # -- Send Strict-Transport-Security from the pod's HTTPS port (tls.enabled only).
  # With TLS at the Ingress, enable HSTS on the Ingress controller instead.
  hsts: false
  # -- Load the optional Google Fonts used by alternative font pairings.
  # Browsers then need access to fonts.googleapis.com and fonts.gstatic.com.
  externalFonts: false

# HTTPS inside the pod (end-to-end TLS). Usually TLS ends at the Ingress and
# this stays off.
tls:
  # -- Serve HTTPS on port 8443 inside the pod.
  enabled: false
  # -- Existing secret of type kubernetes.io/tls (keys tls.crt and tls.key).
  secretName: ""

service:
  # -- ClusterIP, NodePort or LoadBalancer.
  type: ClusterIP
  # -- HTTP service port.
  port: 80
  # -- HTTPS service port, used when tls.enabled is true.
  httpsPort: 443
  # -- Fixed node ports for type NodePort, for example {http: 30080, https: 30443}.
  nodePorts: {}
  # -- Annotations for the service, for example for a cloud load balancer.
  annotations: {}

ingress:
  # -- Create an Ingress.
  enabled: false
  # -- Ingress class, for example nginx or traefik.
  className: ""
  # -- Annotations for the Ingress, for example the controller's HTTPS redirect
  # and HSTS settings.
  annotations: {}
  # -- Host names and paths routed to MSCD.
  hosts:
    - host: mscd.example.internal
      paths:
        - path: /
          pathType: Prefix
  # -- TLS for the Ingress, for example [{secretName: mscd-tls, hosts: [mscd.example.internal]}]
  tls: []

# -- CPU and memory requests and limits for each pod.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  # -- Scale the pods on CPU use with a HorizontalPodAutoscaler. Needs metrics-server.
  enabled: false
  # -- Lowest number of pods.
  minReplicas: 2
  # -- Highest number of pods.
  maxReplicas: 6
  # -- Average CPU use, in percent of the request, that the autoscaler keeps.
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  # -- Keep pods running during node drains (only when more than one pod runs).
  enabled: true
  # -- Pods that must stay available during a drain.
  minAvailable: 1

networkPolicy:
  # -- Allow traffic to the web ports only, and no outbound traffic from the pods.
  enabled: true
  # -- Who may connect. Empty allows any source on the web ports. To allow only
  # the ingress controller (the chart's test pod is always allowed), use for example:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: ingress-nginx
  ingressFrom: []
  # -- Outbound rules. The web app needs none, so the default denies all egress.
  egress: []

topologySpread:
  # -- Spread pods across nodes when possible.
  enabled: true
  # -- Node label that defines the spread, for example topology.kubernetes.io/zone.
  topologyKey: kubernetes.io/hostname

# -- Pod security settings. The defaults match the image (user 101) and the
# "restricted" Pod Security Standard. Change only if your platform requires it.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
  seccompProfile:
    type: RuntimeDefault

# -- Container security settings: no privilege escalation, read-only root
# filesystem, no Linux capabilities.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# -- Seconds a stopping pod keeps serving, so the ingress controller can remove
# it from rotation first. Gives rolling updates without failed requests.
preStopSleepSeconds: 5
# -- Seconds Kubernetes waits for a pod to stop before it is killed.
terminationGracePeriodSeconds: 30

probes:
  # -- Readiness probe timing on /healthz.
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
    failureThreshold: 3
  # -- Liveness probe timing on /healthz.
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# -- Extra annotations for the pods.
podAnnotations: {}
# -- Extra labels for the pods.
podLabels: {}
# -- Node labels the pods must match.
nodeSelector: {}
# -- Tolerations for node taints.
tolerations: []
# -- Affinity rules for the pods.
affinity: {}
# -- Priority class for the pods.
priorityClassName: ""
