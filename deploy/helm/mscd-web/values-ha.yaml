# Reference values for a production cluster (Medium profile).
# Use with: helm install mscd-web mscd-web-<version>.tgz --namespace mscd -f values-ha.yaml
# Replace the registry, host name and secret names with your own.
# Autoscaling needs metrics-server in the cluster.

image:
  repository: registry.example.internal/cyberlentera/mscd-web

replicaCount: 3

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: mscd.example.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mscd-tls
      hosts:
        - mscd.example.internal

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx

topologySpread:
  enabled: true
  topologyKey: kubernetes.io/hostname
