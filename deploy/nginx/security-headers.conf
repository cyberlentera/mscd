# MSCD web: security headers (installed as /etc/nginx/mscd/security-headers.conf).
# Included once at server level (site.conf) and again in every location that
# sets its own headers, because NGINX does not inherit add_header into a
# location that defines add_header itself.
#
# Content-Security-Policy:
#   - scripts only from this server (the build has no inline or external scripts)
#   - inline styles are allowed because the UI sets styles on elements
#   - fonts are self-hosted (IBM Plex). Google Fonts, used only by the optional
#     alternative font pairings, is allowed when MSCD_EXTERNAL_FONTS=true.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'$mscd_csp_style; font-src 'self' data:$mscd_csp_font; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
# Empty unless HSTS is enabled on the HTTPS server (an empty header is not sent).
add_header Strict-Transport-Security $mscd_hsts always;
