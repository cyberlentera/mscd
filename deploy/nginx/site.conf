# MSCD web: site settings shared by the HTTP and HTTPS servers
# (installed as /etc/nginx/mscd/site.conf).

root  /usr/share/nginx/html;
index index.html;

# Defaults for the security headers. Start-up settings in /tmp/mscd/site.d
# can extend the Content-Security-Policy (MSCD_EXTERNAL_FONTS=true).
# $mscd_hsts is set by the server that includes this file.
set $mscd_csp_style "";
set $mscd_csp_font  "";
include /tmp/mscd/site.d/*.conf;

# Security headers on every response of this server, including /healthz,
# errors and redirects. Locations that add headers of their own include the
# file again, because NGINX does not pass add_header down to them.
include /etc/nginx/mscd/security-headers.conf;

# The app only reads static files: anything but GET and HEAD is refused, except
# under /api/ ($mscd_method_refused, nginx.conf).
if ($mscd_method_refused) {
    return 405;
}

# The MSCD API (F.12, I.2.1).
include /etc/nginx/mscd/api.conf;

# Liveness and readiness. Returns 503 when the app files are missing.
location = /healthz {
    access_log off;
    default_type text/plain;
    if (!-f $document_root/index.html) {
        return 503 "unavailable\n";
    }
    return 200 "ok\n";
}

# App entry point: browsers always revalidate, so upgrades show up at once.
location = /index.html {
    # Written at start-up: adds the Google Fonts links when MSCD_EXTERNAL_FONTS=true.
    include /tmp/mscd/index.d/*.conf;

    include /etc/nginx/mscd/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location ^~ /assets/ {
    # Files without a content hash (for example the logo): short cache.
    include /etc/nginx/mscd/security-headers.conf;
    add_header Cache-Control "public, max-age=3600" always;

    # Build output with a content hash in the name (name-AbCd1234.ext): cache for a year.
    location ~ "-[A-Za-z0-9_-]{8}\.[A-Za-z0-9]+$" {
        include /etc/nginx/mscd/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}

# Hidden files are never served.
location ~ /\. {
    return 404;
}

# Missing files with an extension get a real 404 instead of the app shell.
location ~ "\.[A-Za-z0-9]{1,8}$" {
    include /etc/nginx/mscd/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Everything else is a client-side route: serve the app shell.
location / {
    include /etc/nginx/mscd/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
