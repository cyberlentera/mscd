# MSCD web: headers of the problem responses NGINX itself returns under /api/
# (installed as /etc/nginx/mscd/api-problem-headers.conf, included by api.conf).
# The same values the api sends on its JSON responses (F.12).
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Request-Id $request_id always;
