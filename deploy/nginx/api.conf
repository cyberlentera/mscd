# MSCD web: proxy of /api/ to the MSCD api (installed as /etc/nginx/mscd/api.conf,
# included by site.conf; build plan I.2.1 and F.12).
#
# The upstream comes from MSCD_API_UPSTREAM (default api:3000), written at
# start-up to /tmp/mscd/api-upstream.conf by 40-mscd-runtime.sh. With
# MSCD_API_UPSTREAM=none the file holds "return 404;" (web-only use).
#
# ^~ keeps the regular expression locations of site.conf (hidden files, file
# extensions) away from API paths.
location ^~ /api/ {
    include /tmp/mscd/api-upstream.conf;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Overwrite, never append: the client's own X-Forwarded-For is not passed
    # on. $remote_addr is the socket address, or the client behind a trusted
    # proxy when MSCD_TRUSTED_PROXY_CIDRS is set (nginx.conf). The api trusts
    # X-Forwarded-For only from this server's address (http.trust_proxy).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    # Uploads and downloads are streamed, not buffered on disk.
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 110m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Responses can hold secrets (the CSRF token) next to text a client
    # chooses, so they are not compressed (BREACH).
    gzip off;

    # The api sets its own security headers (F.12, F.13 for files); NGINX only
    # makes sure no API response is cached.
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;

    # NGINX error lines quote the raw request line, which can hold an OAuth
    # code or state (/api/v1/auth/oidc/.../callback). Only critical errors are
    # logged here; an unreachable api shows as 503 in the access log (with
    # urt=-) and in the api's own logs.
    error_log /dev/stderr crit;

    # Errors NGINX produces itself (not those of the api) are problem details
    # (D.1) like the api's own.
    error_page 404 = @mscd_api_not_found;
    error_page 413 = @mscd_api_too_large;
    error_page 502 503 504 = @mscd_api_unavailable;
}

location @mscd_api_not_found {
    include /etc/nginx/mscd/api-problem-headers.conf;
    default_type application/problem+json;
    return 404 '{"type":"https://mscd.cyberlentera.com/problems/not-found","title":"Not found","status":404}\n';
}

location @mscd_api_too_large {
    include /etc/nginx/mscd/api-problem-headers.conf;
    default_type application/problem+json;
    return 413 '{"type":"https://mscd.cyberlentera.com/problems/payload-too-large","title":"Request body too large","status":413}\n';
}

location @mscd_api_unavailable {
    include /etc/nginx/mscd/api-problem-headers.conf;
    default_type application/problem+json;
    return 503 '{"type":"https://mscd.cyberlentera.com/problems/dependency-unavailable","title":"The MSCD API is not reachable","status":503}\n';
}
