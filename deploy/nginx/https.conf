# MSCD web: HTTPS server on port 8443 (installed as /etc/nginx/mscd/https.conf).
# Enabled at start-up only when /etc/nginx/tls/tls.crt and tls.key are mounted.
# The file names match a Kubernetes TLS secret, so a secret can be mounted as is.
server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;

    # Mozilla "intermediate" profile: TLS 1.2 and 1.3, forward secrecy only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:MSCD_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Written at start-up: IPv6 listener when available.
    include /tmp/mscd/https.d/*.conf;

    # Strict-Transport-Security: empty (not sent) unless MSCD_HSTS is true.
    set $mscd_hsts "";
    include /tmp/mscd/hsts.d/*.conf;

    include /etc/nginx/mscd/site.conf;
}
