# MSCD web: HTTP server on port 8080 (installed as /etc/nginx/conf.d/default.conf).
server {
    listen 8080 default_server;
    server_name _;

    # Written at start-up: IPv6 listener when available.
    include /tmp/mscd/http.d/*.conf;

    # No Strict-Transport-Security on plain HTTP.
    set $mscd_hsts "";

    include /etc/nginx/mscd/site.conf;

    # Written at start-up: the redirect to HTTPS when a certificate is mounted
    # and MSCD_HTTP_REDIRECT is true. It comes after site.conf, so the redirect
    # carries the security headers.
    include /tmp/mscd/redirect.d/*.conf;
}
