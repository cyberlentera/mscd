# MSCD web: main NGINX configuration (installed as /etc/nginx/nginx.conf).
# The container runs as an unprivileged user with a read-only root filesystem.
# Only /tmp is writable (tmpfs in Compose, emptyDir in Kubernetes).

# A fixed worker count keeps memory use predictable under container limits.
# Scale out with more replicas instead of more workers.
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    # Client address (F.12). Written at start-up from MSCD_TRUSTED_PROXY_CIDRS:
    # set_real_ip_from for each trusted proxy (Helm: the ingress controller) with
    # real_ip_header X-Forwarded-For, so $remote_addr is the client behind it.
    # Empty otherwise: $remote_addr is the socket address and any
    # X-Forwarded-For a client sends is ignored.
    include /tmp/mscd/realip.d/*.conf;

    # The api upstream (MSCD_API_UPSTREAM), written at start-up. Its host name
    # is looked up again while NGINX runs ("resolve"), so a recreated api
    # container with a new address is reached without a restart.
    include /tmp/mscd/upstream.d/*.conf;

    # Methods: the static site answers GET and HEAD only; /api/ takes every
    # method and leaves the decision to the api (site.conf).
    map "$request_method:$uri" $mscd_method_refused {
        "~^(?:GET|HEAD):"  0;
        "~^[A-Z]+:/api/"   0;
        default            1;
    }

    # Access log (F.12). The request line is logged as method, path and a
    # redacted copy of the query string, never as $request, so the values of
    # the query parameters below never reach the log: token, code, state, t,
    # SAMLResponse, RelayState and invitation. Path and query are taken from
    # $request_uri, as the client sent them, because $uri and $args change when
    # a client-side route is answered with /index.html. Each map replaces the
    # value of the last occurrence of one name; the last map replaces the whole
    # query string when a value is still unredacted (the name appears twice) or
    # when a parameter name is percent-encoded (it could spell one of the
    # names). The Referer is logged without its query string and fragment for
    # the same reason (a page such as /reset?token=... is the Referer of its
    # assets).
    map $request_uri $mscd_log_path {
        "~^([^?]*)"                             $1;
        default                                 "";
    }
    map $request_uri $mscd_args_0 {
        "~^[^?]*\?(.*)$"                        $1;
        default                                 "";
    }
    map $mscd_args_0 $mscd_args_1 {
        "~*^((?:.*&)?token=)[^&]*(.*)$"         "$1[redacted]$2";
        default                                 $mscd_args_0;
    }
    map $mscd_args_1 $mscd_args_2 {
        "~*^((?:.*&)?code=)[^&]*(.*)$"          "$1[redacted]$2";
        default                                 $mscd_args_1;
    }
    map $mscd_args_2 $mscd_args_3 {
        "~*^((?:.*&)?state=)[^&]*(.*)$"         "$1[redacted]$2";
        default                                 $mscd_args_2;
    }
    map $mscd_args_3 $mscd_args_4 {
        "~*^((?:.*&)?t=)[^&]*(.*)$"             "$1[redacted]$2";
        default                                 $mscd_args_3;
    }
    map $mscd_args_4 $mscd_args_5 {
        "~*^((?:.*&)?SAMLResponse=)[^&]*(.*)$"  "$1[redacted]$2";
        default                                 $mscd_args_4;
    }
    map $mscd_args_5 $mscd_args_6 {
        "~*^((?:.*&)?RelayState=)[^&]*(.*)$"    "$1[redacted]$2";
        default                                 $mscd_args_5;
    }
    map $mscd_args_6 $mscd_args_7 {
        "~*^((?:.*&)?invitation=)[^&]*(.*)$"    "$1[redacted]$2";
        default                                 $mscd_args_6;
    }
    map $mscd_args_7 $mscd_args_redacted {
        "~*(?:^|&)(?:token|code|state|t|SAMLResponse|RelayState|invitation)=(?!\[redacted\](?:&|$))"  "[redacted]";
        "~(?:^|&)[^=&]*%"                       "[redacted]";
        default                                 $mscd_args_7;
    }
    map $mscd_args_redacted $mscd_log_query {
        ""                                      "";
        default                                 "?$mscd_args_redacted";
    }
    map $http_referer $mscd_log_referer {
        "~^([^?#]*)"                            $1;
        default                                 "";
    }

    # Error log lines about a request quote the raw request line and the
    # Referer, so they could carry the query values the access log redacts
    # (for example "client intended to send too large body" on any path). For
    # requests only critical errors are logged; such a request still shows in
    # the access log with its status (413, 503 when the api is not reachable,
    # urt=-). Start-up and configuration messages use the level at the top.
    error_log /dev/stderr crit;
    log_not_found off;

    log_format mscd '$remote_addr [$time_local] "$request_method $mscd_log_path$mscd_log_query $server_protocol" '
                    '$status $body_bytes_sent "$mscd_log_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time rid=$request_id';
    access_log /dev/stdout mscd;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # The static app expects no request bodies; /api/ raises the limit for
    # uploads (api.conf).
    client_max_body_size        16k;
    client_body_buffer_size     16k;
    large_client_header_buffers 4 16k;

    # Compression. Text assets are also pre-compressed at build time (.gz files).
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # HTTP server on 8080 (always on).
    include /etc/nginx/conf.d/*.conf;

    # HTTPS server on 8443, written at start-up only when a certificate is mounted
    # at /etc/nginx/tls (see /docker-entrypoint.d/40-mscd-runtime.sh).
    include /tmp/mscd/conf.d/*.conf;
}
