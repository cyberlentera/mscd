# MSCD web: main NGINX configuration (installed as /etc/nginx/nginx.conf).
# The container runs as an unprivileged user with a read-only root filesystem.
# Only /tmp is writable (tmpfs in Compose, emptyDir in Kubernetes).

# A fixed worker count keeps memory use predictable under container limits.
# Scale out with more replicas instead of more workers.
worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset      utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    # The app is static and read-only: no request bodies are expected.
    client_max_body_size        16k;
    client_body_buffer_size     16k;
    large_client_header_buffers 4 16k;

    # Compression. Text assets are also pre-compressed at build time (.gz files).
    gzip            on;
    gzip_static     on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # HTTP server on 8080 (always on).
    include /etc/nginx/conf.d/*.conf;

    # HTTPS server on 8443, written at start-up only when a certificate is mounted
    # at /etc/nginx/tls (see /docker-entrypoint.d/40-mscd-runtime.sh).
    include /tmp/mscd/conf.d/*.conf;
}
